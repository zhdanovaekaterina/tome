[project]
name = "tome"
version = "0.0.1"
description = "Backend for a tabletop RPG session assistant: character sheet, spell management, and resource tracking for D&D 5e."
authors = [{name = "Екатерина Жданова", email = "zhdanova.ekaterina.95@yandex.ru."}]
license = {file = "LICENSE"}
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Role-Playing",
]

[project.dependencies]
pytest = ">=9.1.1"
mypy = ">=2.4.0"
ruff = ">=0.16.10"