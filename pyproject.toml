[project]
name = "tome"
version = "0.1.0"
description = "Backend for a tabletop RPG session assistant: character sheet, spell management, and resource tracking for D&D 5e."
authors = [{name = "Екатерина Жданова", email = "zhdanova.ekaterina.95@yandex.ru."}]
license = {file = "LICENSE"}
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = []
dev-dependencies=[
    "pytest>=9.1.1",
    "mypy>=2.4.0",
    "ruff>=0.16.10",
    "pytest-cov>=7.1.0",
    "python-semantic-release>=10.7.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=xml"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py314"
line-length = 120
fix = true
include = [
    "src/*.py",
]
exclude = [
    "__pycache__"
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "D105", "CPY001", "COM812"]

[tool.coverage.run]
omit = [
    "*/__init__.py",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
commit_author = "Zhdanova Ekaterina <zhdanova.ekaterina.95@yandex.ru>"
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
allow_zero_version = true

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"