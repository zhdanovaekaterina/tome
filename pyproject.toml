[project]
name = "tome"
version = "0.0.1"
description = "Backend for a tabletop RPG session assistant: character sheet, spell management, and resource tracking for D&D 5e."
authors = [{name = "Екатерина Жданова", email = "zhdanova.ekaterina.95@yandex.ru."}]
license = {file = "LICENSE"}
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = [
    "pytest>=9.1.1",
    "mypy>=2.4.0",
    "ruff>=0.16.10",
    "pytest-cov>=7.1.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.coverage.run]
omit = [
    "*/__init__.py",
]